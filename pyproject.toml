[project]
name = "app"
version = "0.2.0"
description = "Template bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles==25.1.0",
    "aiohttp==3.13.3",
    "apscheduler==3.11.2",
    "fastapi[standard]==0.128.0",
    "pydantic-settings==2.12.0",
    "sqlmodel==0.0.31",
    "yfinance==1.0.00",
]

[dependency-groups]
dev = [
    "ipykernel==7.1.0",
    "ipywidgets==8.1.8",
    "nbformat==5.10.4",
]

[tool.ruff]
line-length = 130
unfixable = ["F401"] # Disable fix for unused imports (`F401`)
